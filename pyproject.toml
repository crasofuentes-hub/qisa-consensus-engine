# pyproject.toml — QISA Consensus Engine (reference-grade, Feb 2026)

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "qisa-consensus-engine"
version = "0.1.3"
description = "Deterministic multi-perspective consensus engine with fixpoint convergence, auditability, and categorical coherence metrics."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Oscar Fuentes Fernández" }]
keywords = [
  "ai-consensus",
  "multi-agent-systems",
  "deterministic-ai",
  "auditability",
  "fixpoint",
  "convergence",
  "categorical-reasoning",
  "verifiable-ai",
  "tamper-evident",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security :: Cryptography",
]

[project.urls]
Repository = "https://github.com/crasofuentes-hub/qisa-consensus-engine"
Documentation = "https://github.com/crasofuentes-hub/qisa-consensus-engine/tree/main/docs"
Issues = "https://github.com/crasofuentes-hub/qisa-consensus-engine/issues"
Changelog = "https://github.com/crasofuentes-hub/qisa-consensus-engine/blob/main/CHANGELOG.md"
Releases = "https://github.com/crasofuentes-hub/qisa-consensus-engine/releases"

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=5.0",
  "hypothesis>=6.0",
  "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qisa"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
fix = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"